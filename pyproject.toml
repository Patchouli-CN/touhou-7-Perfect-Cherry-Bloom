[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "touhou07"
version = "0.1.0"
description = "TH07 (Touhou Youyoumu) Python reimplementation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pillow>=10.0",
    "pygame>=2.5",
    "loguru",
    "msgspec>=0.21.1",
    "pyfiglet>=1.0.4",
]

[project.scripts]
touhou07 = "touhou.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["touhou"]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["touhou/test"]

[tool.mypy]
python_version = "3.12"
# 宽松渐进档: 未注解的函数不强制补签名(allow_untyped_defs), 但函数体照查
# (check_untyped_defs), 并抓明显错误(Any 泄漏返回/无效忽略/冗余 cast/松相等)。
allow_untyped_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

# pygame 渲染层豁免: 大量 `self.x = None` 延迟初始化 + 界面流程状态机 union
# 是刻意写法, mypy 对 pygame stub 也常有噪音; 该层由全量测试(SDL dummy)兜底。
[[tool.mypy.overrides]]
module = "touhou.engine.view.*"
ignore_errors = true

# 测试目录豁免: pytest 驱动, 构造夹具时有意打破类型(鸭子类型替身等)。
[[tool.mypy.overrides]]
module = "touhou.test.*"
ignore_errors = true
